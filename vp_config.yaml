# =====================================================================
# Validation Pipeline — config manifest (MVP)
# The single source of truth the driver reads to: build per-stage/per-model
# packages, enforce blinding (leakage linter), route/label files, gate the
# ladder, and scaffold scorecards. Human still executes (vendor agent apps)
# and grades. See TOOL_MVP_DESIGN.md.
# Model versions marked (confirm) move fast — verify at run time.
# =====================================================================

project: LoveSmarter-validation
numbering: "new 1-13 (see INVEST_Qs_OG_all.md)"

# ---- The work under validation (NEVER a validator) ----
origin:
  model: Claude Fable 5
  vendor: Anthropic
  results_key: operator/origin_Fable-5/       # the held-back answer key
  source_data: data/LSS1_Clean_Skopje2_3133Ps_noContacts_ZV_6_8_26_forPascal.sav

# ---- Roots (all relative to the project root: dir holding .rrg_root) ----
paths:
  model_facing_root: shared                   # may be shared with validators
  subset_folder:     shared/validation_subset # auto-shared to ALL; hash-locked
  operator_root:     operator                 # withheld kit + grading
  package_out:       operator/_packages       # driver assembles packages here

# ---- File registry: routing class per file ----
files:
  # Sent to every stage + model:
  all:
    - shared/STUDY_OVERVIEW_all.md
    - shared/INVEST_Qs_OG_all.md
    - shared/DYFA_Guidelines_all.pdf
  # Entire folder auto-shared to all; linter verifies it is unmodified:
  subset:
    path: shared/validation_subset/
    hash_locked: true
  # Operator-side files sent ONLY for the stage(s) listed:
  stage_specific:
    - file: RRG/prompts/ANALYSIS_PROTOCOL_OG.md  # original methods = replication target
      send_in: [replication]
  # Kept as archive/documentation, never sent:
  archive_never_send:
    - operator/archive/ANALYSIS_PROTOCOL_arm2.md        # converged methods (arm-era); legacy
  # Never leaves the operator side (breaks blinding):
  withheld:
    - operator/origin_Fable-5/                   # = results key
    - "operator/**/SCORECARD_*"
    - operator/factor_tooling/                   # factor-validation tooling + data

# ---- Roster: stage -> validator models ----
# type: frontier (closed) | open (open-weights). Each stage needs >=1 of each.
# access: ALL validator models run via one OpenRouter account + an agent CLI (e.g., Hermes);
#         the software build uses Claude Code separately. (Uniform stack → replication varies only the model.)
roster:
  replication:
    - { model: "Gemini (confirm flagship)", vendor: Google, type: frontier, license: proprietary, note: "accessed via OpenRouter (NYU institutional Gemini blocks CLI/agentic)" }
    - { model: "Nemotron-3 (Super/Ultra)",  vendor: NVIDIA, type: open, license: "NVIDIA Open Model License", repeatable: true }
  robustness:
    - { model: "GPT-5.5", vendor: OpenAI, type: frontier, license: proprietary, harness: "Codex app", status: done }
    - { model: "DeepSeek (confirm)", vendor: DeepSeek, type: open, license: "MIT (confirm)", status: pending }
    - { model: "Laguna-M.1", vendor: Poolside, type: open, license: "Apache-2.0", status: "partial run — re-run on clean setup" }
    # Laguna XS.2 (smaller, 33B) also Apache-2.0 open, available as extra diversity.
  generalization:
    - { model: "Grok (confirm flagship)", vendor: xAI, type: frontier, license: proprietary }
    - { model: "Qwen (confirm)", vendor: Alibaba, type: open, license: "Apache-2.0 (confirm)" }

# ---- Stages: the degrees-of-freedom ladder ----
stages:
  - id: replication
    order: 1
    opens: model                 # vary model only; method + data fixed
    methodology: revealed        # the _OG protocol IS what's being replicated
    prompt_skill: vp-replication
    prompt_doc: RRG/prompts/STAGE1_REPLICATION_PROMPT.md
    send: [all, subset, "RRG/prompts/ANALYSIS_PROTOCOL_OG.md"]
    output_folder: "REPLICATE_{MODEL}/"
    report_name: "{MODEL}_Report.docx"
    grade_into: SCORECARD_stage1
    expected_verdict: REPRODUCED   # a miss localizes a model/stack difference

  - id: robustness
    order: 2
    opens: method                # models design their own; question + data fixed
    methodology: hidden          # NO protocol file may be sent
    prompt_skill: vp-robustness
    prompt_doc: RRG/prompts/METHOD_FREE_PROMPT.md
    send: [all, subset]
    output_folder: "{MODEL}/"
    report_name: "{MODEL}_Report.docx"
    grade_into: SCORECARD_stage2
    gate: replication_graded
    status: "GPT-5.5 done (v2); DeepSeek pending"

  - id: generalization
    order: 3
    opens: data                  # vary the dataset (splits / holdout / new sample)
    methodology: agreed_or_free  # TBD with advisor
    data_plan: TBD               # gates this stage
    prompt_skill: vp-generalization
    send: [all, subset_newdata]  # subset rebuilt on new data; factors scored via fixed loadings
    output_folder: "GENERALIZE_{MODEL}/"
    report_name: "{MODEL}_Report.docx"
    grade_into: SCORECARD_stage3
    gate: robustness_graded
    status: pending_data_plan

# ---- Blinding / leakage linter (runs before every dispatch) ----
blinding:
  always_withhold:               # fail if present in an outgoing package
    - "origin_Fable-5/"
    - "SCORECARD_*"
    - "factor_tooling/"
    - "ORIGINAL_METHODOLOGY.md"
    - "ANALYSIS_PROTOCOL_arm2.md"
  result_token_scan:
    source: operator/origin_Fable-5/     # extract result numbers/keywords from the key
    action: flag                        # human confirms (semantic judgment)
  per_stage_methodology:
    replication:   { require: ["ANALYSIS_PROTOCOL_OG.md"], forbid: [] }
    robustness:    { require: [], forbid: ["ANALYSIS_PROTOCOL_OG.md", "ANALYSIS_PROTOCOL_arm2.md", "*PROTOCOL*", "ORIGINAL_METHODOLOGY.md"] }
    generalization: { require: [], forbid: ["ORIGINAL_METHODOLOGY.md"] }
  subset_integrity: hash_check          # validation_subset/ must match source
  fail_action: block_dispatch           # override => logged human approval

# ---- Constraints (driver enforces) ----
constraints:
  exclude_as_validator: [Anthropic]   # origin family (Claude/Fable/Mythos) stays out        # origin family stays out
  per_stage_requires_open_weights_if_multiple: true
  spread_frontier_families: true        # no vendor underpins >1 stage (advisory)
  determinism:
    temperature: 0
    seed: fixed                         # critical for the replication stage

# ---- Provenance (audit trail; strengthens the methods section) ----
provenance:
  log_per_run: true
  record: [stage, model, files_sent, file_hashes, prompt_version, timestamp, blinding_lint_result]

# ---- Dispatch (GUI guides the hand-off to your agent CLI) ----
# The validator interaction is multi-turn, so the GUI does NOT bake the prompt
# into a one-shot command. It guides: cd into the (empty) output folder → start
# the agent → paste the stage prompt's turns in order (read from the stage's
# prompt_doc and shown turn-by-turn). Execution stays in the CLI/Hermes loop.
# start_template placeholders: {openrouter} {model}
dispatch:
  start_template: "hermes run --model {openrouter}"
  # OpenRouter model slugs — VERIFY each at openrouter.ai/models (they move fast).
  openrouter:
    "Gemini (confirm flagship)": "google/gemini-flagship"
    "Nemotron-3 (Super/Ultra)":  "nvidia/nemotron-3"
    "GPT-5.5":                   "openai/gpt-5.5"
    "DeepSeek (confirm)":        "deepseek/deepseek-chat"
    "Laguna-M.1":                "poolside/laguna-m.1"
    "Grok (confirm flagship)":   "x-ai/grok-flagship"
    "Qwen (confirm)":            "qwen/qwen-flagship"
